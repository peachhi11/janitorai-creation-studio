name: README impact

on:
  pull_request:

permissions:
  contents: read

jobs:
  readme-impact:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Check README impact of the pull request diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-readme-impact.mjs --range "origin/${BASE_REF}" "${HEAD_SHA}"
