name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: janitorai-bot-creator
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: janitorai-bot-creator/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high
