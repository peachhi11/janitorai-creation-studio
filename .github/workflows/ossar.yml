# This workflow uses actions that are not certified by GitHub.
# They are provided by a third party and are governed by separate terms of
# service, privacy policy, and support documentation.

# OSSAR runs open-source static analysis tools and uploads the results to
# GitHub Code Scanning as SARIF.
name: OSSAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"

permissions:
  contents: read

jobs:
  OSSAR-Scan:
    # OSSAR currently runs on Windows-hosted runners.
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run OSSAR
        id: ossar
        uses: github/ossar-action@v1

      - name: Upload OSSAR results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.ossar.outputs.sarifFile }}
