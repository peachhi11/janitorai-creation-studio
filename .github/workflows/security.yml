name: Security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: janitorai-bot-creator
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: janitorai-bot-creator/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run high-severity dependency audit
        run: npm audit --audit-level=high

      - name: Run security regression suite
        run: npm test

      - name: Check tracked files and workflow permissions
        run: npm run security:check
